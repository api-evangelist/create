name: Create
description: >-
  CREATE Medicines is a Cambridge, Massachusetts biopharmaceutical company
  developing in vivo CAR (chimeric antigen receptor) cell therapies using mRNA
  lipid-nanoparticle (mRNA-LNP) delivery. Its platform reprograms immune cells,
  including T cells, NK cells, and myeloid cells, directly inside the body rather
  than extracting and engineering them ex vivo, with clinical and preclinical
  programs spanning oncology, autoimmune disease, and fibrosis. Surfaced as a
  portfolio company of 8vc and added to the API Evangelist network as a stub. The
  enrichment pipeline found no developer or API surface; this is a clinical-stage
  therapeutics company, not a software or platform provider, so no API artifacts
  were produced (none is the correct, non-fabricated result).
